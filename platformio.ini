; Un solo repo, dos firmwares para la misma placa (NodeMCU-32S).
;   pio run -e monitor -t upload   -> Módulo A: nodo de monitoreo
;   pio run -e spray   -t upload   -> Módulo B: demo de pulverización selectiva

[platformio]
src_dir = firmware
default_envs = monitor

[env]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time

[env:monitor]
build_src_filter = +<monitor/>
build_flags = -D MODULE_NAME=\"monitor\"

[env:spray]
build_src_filter = +<spray/>
build_flags = -D MODULE_NAME=\"spray\"
